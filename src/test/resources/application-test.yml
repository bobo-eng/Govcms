spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=MySQL
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
  data:
    redis:
      host: localhost
      port: 6379
  quartz:
    job-store-type: memory

gm:
  crypto:
    enabled: false
    sm4:
      key-hex: 0123456789abcdef0123456789abcdef

app:
  rate-limit:
    enabled: false
