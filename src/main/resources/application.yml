spring:
  application:
    name: govcms-admin
  profiles:
    default: local
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        search:
          backend:
            type: lucene
            directory:
              type: local-filesystem
              root: ./storage/search-indexes
          indexing:
            plan:
              synchronization:
                strategy: sync
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      database: 0
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
  quartz:
    job-store-type: jdbc
    jdbc:
      initialize-schema: always
    properties:
      org:
        quartz:
          scheduler:
            instanceName: govcms-scheduler
            instanceId: AUTO
          jobStore:
            tablePrefix: QRTZ_
            useProperties: false
            isClustered: false
          threadPool:
            class: org.quartz.simpl.SimpleThreadPool
            threadCount: 5

server:
  port: 8081

logging:
  level:
    root: INFO
    gov.cms: DEBUG

jwt:
  # secret 已废弃：国密 JWT 使用 SM2 密钥对签名，不再使用 HMAC secret
  expiration: 86400000

gm:
  crypto:
    enabled: true
    sm2:
      private-key-hex: ${GM_SM2_PRIVATE_KEY:}
      public-key-hex: ${GM_SM2_PUBLIC_KEY:}
    sm4:
      key-hex: ${GM_SM4_KEY:}

app:
  media:
    storage-path: ./storage/media
  publish:
    storage-path: ./storage/publish