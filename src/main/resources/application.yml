spring:
  application:
    name: govcms-admin
  profiles:
    default: local
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

server:
  port: 8080

logging:
  level:
    root: INFO
    gov.cms: DEBUG

jwt:
  # secret 已废弃：国密 JWT 使用 SM2 密钥对签名，不再使用 HMAC secret
  expiration: 86400000

gm:
  crypto:
    enabled: true
    sm2:
      private-key-hex: ${GM_SM2_PRIVATE_KEY:}
      public-key-hex: ${GM_SM2_PUBLIC_KEY:}

app:
  media:
    storage-path: ./storage/media