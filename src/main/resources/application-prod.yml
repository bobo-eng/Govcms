spring:
  datasource:
    url: ${PROD_DB_URL:jdbc:dm://localhost:5236/GOVCMS1}
    username: ${PROD_DB_USER:GOVCMS1}
    password: ${PROD_DB_PASSWORD:}
    driver-class-name: dm.jdbc.driver.DmDriver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.DmDialect
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: 0
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 4
  cache:
    type: redis
    redis:
      time-to-live: 300000
      cache-null-values: false
  quartz:
    job-store-type: jdbc
    jdbc:
      initialize-schema: never
    properties:
      org:
        quartz:
          scheduler:
            instanceName: govcms-scheduler
            instanceId: AUTO
          jobStore:
            class: org.quartz.impl.jdbcjobstore.JobStoreTX
            driverDelegateClass: org.quartz.impl.jdbcjobstore.StdJDBCDelegate
            tablePrefix: QRTZ_
            useProperties: false
            isClustered: true
          threadPool:
            class: org.quartz.simpl.SimpleThreadPool
            threadCount: 10

server:
  port: 8080
  servlet:
    session:
      timeout: 30m

logging:
  level:
    root: WARN
    gov.cms: INFO
    org.springframework.security: WARN

jwt:
  expiration: 86400000

gm:
  crypto:
    enabled: true
    sm2:
      private-key-hex: ${GM_SM2_PRIVATE_KEY:}
      public-key-hex: ${GM_SM2_PUBLIC_KEY:}
    sm4:
      key-hex: ${GM_SM4_KEY:}

app:
  media:
    storage-path: /var/govcms/storage/media
  publish:
    storage-path: /var/govcms/storage/publish
  rate-limit:
    enabled: true
    rules:
      - path: "/api/auth/login"
        capacity: 5
        refill: 1
        period: MINUTES
      - path: "/api/portal/search"
        capacity: 60
        refill: 1
        period: SECONDS
      - path: "/api/publish/"
        capacity: 10
        refill: 1
        period: MINUTES
