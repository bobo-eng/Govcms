<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title th:text="${pageTitle}">首页</title>
  <meta name="keywords" th:if="${siteContext != null}" th:content="${siteContext['name']}" />
  <meta name="description" th:if="${siteContext != null}" th:content="${siteContext['description']}" />
  <link rel="stylesheet" href="/css/portal.css">
</head>
<body class="portal-home-page">
  <div th:if="${warnings != null and !warnings.isEmpty()}" class="pb-warn">
    <div th:each="item : ${warnings}" th:text="${item}">warning</div>
  </div>
  <section th:each="slot : ${layoutSlots}" class="pb-slot" th:attr="data-slot=${slot.name}">
    <div th:utext="${slotHtml[slot.name]}"></div>
  </section>
</body>
</html>
